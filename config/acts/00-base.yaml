# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# ACT 0 — the starting state.
#
# A gateway in front of the models, and nothing else. No identity, no budgets,
# no guardrails, no tool governance. Traffic flows and nobody can answer who
# spent what or what was sent. This is the "before" picture.
config:
  adminAddr: 0.0.0.0:15000
  license:
    key:
      file: /config/license.key
  database:
    url: "sqlite:///data/demo.db?mode=rwc"

llm:
  port: 4000
  models:
  - name: "*"
    provider: openAI
    params:
      baseUrl: "http://upstream-primary:8080/v1"
      model: gpt-4o-mini
      apiKey: "unused-by-the-mock-upstream"

# The MCP side of the same ungoverned picture: two tool servers behind one
# endpoint, every tool visible to every caller, no authorization at all.
mcp:
  port: 3000
  toolMode: standard
  codeModeSettings:
    timeout: 1m0s
    cpuTimeout: 1s
  targets:
  - name: records
    mcp:
      host: mcp-records
      port: 9000
      path: /mcp
  - name: platform-ops
    mcp:
      host: mcp-platform-ops
      port: 9000
      path: /mcp


# -----------------------------------------------------------------------------
# Security token service.
#
# This section must be present in EVERY config the proxy loads: the bundle
# launcher is told to run the STS and hard-fails the whole unit when a config
# has no `entSts`. It is inert until Act 3 actually exchanges a token.
#
# All three validator lists are required even if you only use one flow. The STS
# builds each at startup and refuses to start when any is empty.
# -----------------------------------------------------------------------------
entSts:
  enabled: true
  issuer: http://localhost:7777
  tokenExpiration: 1h
  requireAudience: false
  privateKeyPath: /config/sts-jwt.pem
  subjectValidators:
  - validatorType: remote
    issuer: http://keycloak:18083/realms/demo
    remoteConfig:
      url: http://keycloak:18083/realms/demo/protocol/openid-connect/certs
  actorValidators:
  - validatorType: remote
    issuer: http://keycloak:18083/realms/demo
    remoteConfig:
      url: http://keycloak:18083/realms/demo/protocol/openid-connect/certs
  apiValidators:
  - validatorType: remote
    issuer: http://keycloak:18083/realms/demo
    remoteConfig:
      url: http://keycloak:18083/realms/demo/protocol/openid-connect/certs

