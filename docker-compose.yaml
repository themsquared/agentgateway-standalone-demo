# Solo Enterprise for agentgateway — standalone, on Docker Compose.
#
# Deliberately not Kubernetes. This is the standalone binary in a container
# reading one configuration file, which is the same shape you would deploy as an
# ECS task definition or on a VM.
#
#   docker compose up -d
#   ./agentgateway-demo.sh --check
#   ./agentgateway-demo.sh

name: agentgateway-demo

services:
  # ---------------------------------------------------------------------------
  # The gateway. Bundle image, because Act 3 uses the security token service,
  # and the plain proxy image carries only the proxy.
  # ---------------------------------------------------------------------------
  agentgateway:
    image: us-docker.pkg.dev/solo-public/enterprise-agentgateway/agentgateway-enterprise-bundle:2026.9.0
    container_name: agentgateway
    volumes:
      - ./config:/config
      - ./data:/data
    ports:
      - "4000:4000"                 # LLM traffic
      - "3000:3000"                 # MCP traffic
      - "14001:4001"                # UI served on a gateway (Act 3, behind OIDC)
      - "127.0.0.1:15000:15000"     # admin + built-in UI. Localhost only, on purpose.
      - "127.0.0.1:7777:7777"       # STS, for the Act 3 delegation scene
    environment:
      # The launcher runs the STS, waits for it, then starts the proxy. It
      # HARD-FAILS the whole unit if the loaded config has no `entSts` section,
      # which is why every act config here carries one.
      AGW_BUNDLE_STS_ENABLED: "${AGW_BUNDLE_STS_ENABLED:-false}"
      AGW_BUNDLE_CONFIG_FILE: /config/config.yaml
      # The launcher binds the STS to loopback by default, which means only the
      # proxy can reach it. The demo calls the delegation endpoint directly to
      # show the `act` claim, so bind it on the compose network instead. In
      # production leave it on loopback.
      AGW_BUNDLE_STS_ADDRESS: 0.0.0.0:7777
      # Providers are optional. With no keys set, everything routes to the
      # bundled mock upstreams and the demo still runs end to end.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-}
    depends_on:
      - upstream-primary
      - upstream-backup
      - upstream-local
      - mcp-records
      - mcp-platform-ops
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Two OpenAI-compatible upstreams. "primary" stands in for Bedrock and
  # "backup" for Azure OpenAI, so the failover scene is deterministic and needs
  # no cloud credentials. Swap the hosts in config to use the real thing.
  # ---------------------------------------------------------------------------
  upstream-primary:
    image: python:3.12-slim
    container_name: upstream-primary
    command: ["python", "/srv/mock_provider.py"]
    environment:
      UPSTREAM_NAME: primary-provider
      PORT: "8080"
    volumes:
      - ./services/mock_provider.py:/srv/mock_provider.py:ro
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

  upstream-backup:
    image: python:3.12-slim
    container_name: upstream-backup
    command: ["python", "/srv/mock_provider.py"]
    environment:
      UPSTREAM_NAME: backup-provider
      PORT: "8080"
    volumes:
      - ./services/mock_provider.py:/srv/mock_provider.py:ro
    ports:
      - "127.0.0.1:18081:8080"
    restart: unless-stopped

  upstream-local:
    image: python:3.12-slim
    container_name: upstream-local
    command: ["python", "/srv/mock_provider.py"]
    environment:
      UPSTREAM_NAME: local-model
      PORT: "8080"
    volumes:
      - ./services/mock_provider.py:/srv/mock_provider.py:ro
    ports:
      - "127.0.0.1:18082:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Two MCP servers, so Act 3 federates rather than proxies one thing.
  # ---------------------------------------------------------------------------
  mcp-records:
    image: python:3.12-slim
    container_name: mcp-records
    command: ["python", "/srv/mcp_server.py"]
    environment:
      MCP_SERVER: records
      PORT: "9000"
    volumes:
      - ./services/mcp_server.py:/srv/mcp_server.py:ro
    restart: unless-stopped

  mcp-platform-ops:
    image: python:3.12-slim
    container_name: mcp-platform-ops
    command: ["python", "/srv/mcp_server.py"]
    environment:
      MCP_SERVER: platform-ops
      PORT: "9000"
    volumes:
      - ./services/mcp_server.py:/srv/mcp_server.py:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak stands in for whatever OIDC provider you run. Swap the issuer and
  # the JWKS URL and the policies in config/acts/ are unchanged.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak
    command: ["start-dev", "--import-realm", "--http-port=18083"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:18083
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "18083:18083"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OTLP destination, standing in for whatever aggregator or SIEM you run.
  # Replace the exporter in otel/collector.yaml; nothing else changes.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
    restart: unless-stopped
